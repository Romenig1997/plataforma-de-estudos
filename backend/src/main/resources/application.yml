spring:
  application:
    name: plataforma-de-estudos

server:
  port: ${SERVER_PORT:8080}

# ---------------------------------------------------------------------------
# Banco de dados
#
# Nao configurado de proposito na Etapa 0: nao existe nenhuma entidade nem
# consulta, entao o Spring Boot nao cria DataSource nem EntityManagerFactory
# e a aplicacao sobe sem tocar em nenhum banco.
#
# O wiring real (spring.datasource.*) entra na HU05 - Estruturacao de Banco
# de Dados, usando as variaveis documentadas em backend/.env.example.
# ---------------------------------------------------------------------------
# spring:
#   datasource:
#     url: ${DB_URL}
#     username: ${DB_USERNAME}
#     password: ${DB_PASSWORD}
#
# ---------------------------------------------------------------------------
# JPA - ativado na HU05, junto com o esquema
# ---------------------------------------------------------------------------
# spring:
#   jpa:
#     hibernate:
#       ddl-auto: validate
#     open-in-view: false

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level:
    br.com.romenig.plataforma: INFO