# O Tomcat recebe o multipart antes do Spring. Sem estes limites compatíveis,
# arquivos acima de 2 MB podem ter a conexão encerrada antes de chegar ao
# controlador, mesmo que spring.servlet.multipart aceite o arquivo.
spring:
  application:
    name: plataforma-de-estudos

  # Carrega o backend/.env como se fosse um .properties.
  #
  # O Spring Boot NAO le .env nativamente: ele so le application.yml,
  # variaveis de ambiente do processo e argumentos de linha de comando. Sem
  # esta linha, criar o .env nao tem efeito nenhum e a aplicacao falha com
  # 'url' must start with "jdbc".
  #
  # O prefixo "optional:" evita que a aplicacao quebre quando o arquivo nao
  # existe - e o caso da CI e de qualquer maquina sem credencial local. Nesse
  # cenario o banco ainda e obrigatorio, mas o erro passa a ser explicito:
  # "Could not resolve placeholder 'DB_URL'".
  #
  # O hint "[.properties]" e o que faz o Spring tratar um arquivo sem
  # extensao como properties. Sem ele: "File extension is not known to any
  # PropertySourceLoader".
  config:
    import: "optional:file:.env[.properties]"

  # -------------------------------------------------------------------------
  # Banco de dados: PostgreSQL do Supabase.
  #
  # As credenciais vem do painel do projeto (Settings -> Connect) e nunca sao
  # commitadas. Veja backend/.env.example.
  #
  # Sem DB_URL a aplicacao nao sobe: a partir da HU01 existe entidade a
  # persistir, entao o DataSource e obrigatorio.
  # -------------------------------------------------------------------------
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # -------------------------------------------------------------------------
  # Upload de PDF do edital (HU07, incremento A).
  #
  # max-file-size: limite por arquivo (o service valida com o mesmo 30MB);
  # max-request-size: folga do multipart completo, que leva tambem os campos
  # de texto alem do binario.
  # -------------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 32MB

  # -------------------------------------------------------------------------
  # Schema (HU05) - versionado com Flyway.
  #
  # Desde a HU05 o esquema e versionado por migrations em db/migration, no
  # lugar do schema.sql idempotente das HUs 01/03/04. Cada arquivo roda uma vez
  # e o Flyway guarda o historico na tabela flyway_schema_history.
  #
  # baseline-on-migrate + baseline-version=1: o banco do Supabase ja tem a
  # estrutura da V1 (criada pelo schema.sql antigo). Com isso o Flyway trata a
  # V1 como baseline nesse banco e aplica apenas a V2 em diante. Num banco
  # vazio (H2 dos testes) as migrations rodam do zero, V1 e V2.
  #
  # O Hibernate continua so VALIDANDO (ddl-auto: validate): se a entidade e o
  # banco divergirem, a aplicacao falha na inicializacao em vez de subir com o
  # schema errado.
  # -------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  # Railway injeta PORT no ambiente. SERVER_PORT preserva a execução local.
  port: ${PORT:${SERVER_PORT:8080}}
  tomcat:
    max-http-form-post-size: 32MB
    max-swallow-size: 32MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

plataforma:
  cors:
    origens: ${CORS_ORIGINS:http://localhost:5173}

  # -------------------------------------------------------------------------
  # Supabase Auth e Storage.
  #
  # Cadastro, login, logout, confirmacao de e-mail e redefinicao de senha sao
  # feitos pelo Supabase Auth no frontend. O backend apenas confere o access
  # token enviado em Authorization: Bearer.
  #
  # url: URL do projeto (Settings -> API). OBRIGATORIA: sem SUPABASE_URL a
  # aplicacao nao sobe. O emissor aceito e {url}/auth/v1.
  #
  # jwt-secret: apenas para projetos que ainda assinam tokens com o segredo
  # legado (HS256). Projetos com chaves assimetricas (ES256/RS256) deixam
  # vazio: as chaves publicas sao lidas do JWKS do projeto.
  #
  # chave-publica: chave anon/publishable, enviada como "apikey" ao Storage.
  # Nao e segredo, mas fica no .env para trocar de projeto sem recompilar.
  #
  # bucket-fotos / bucket-pdfs: buckets criados por supabase/migrations. O de
  # PDFs e privado e separado do de fotos (que e publico).
  # -------------------------------------------------------------------------
  supabase:
    url: ${SUPABASE_URL}
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    chave-publica: ${SUPABASE_ANON_KEY:}
    bucket-fotos: ${SUPABASE_BUCKET_FOTOS:avatars}
    bucket-pdfs: ${SUPABASE_BUCKET_PDFS:editais-pdf}

  # Validade das URLs assinadas que o leitor do curso abre (ISO-8601). Curta:
  # quem tiver a URL le o PDF ate ela expirar.
  pdfs:
    validade-url-assinada: ${PDF_VALIDADE_URL_ASSINADA:PT1H}

  # supabase grava as fotos no Supabase Storage; memoria existe so para testes.
  armazenamento:
    tipo: ${PLATAFORMA_ARMAZENAMENTO:supabase}

  # -------------------------------------------------------------------------
  # Extracao de editais via IA (HU07, incremento A).
  #
  # tipo: rest (padrao) chama o provedor configurado no contrato "chat
  # completions"; manual le o texto e sugere uma arvore localmente, sem custo
  # de IA; fake existe apenas para os testes. A chave mora no .env (IA_API_KEY)
  # e nao e versionada: sem ela a aplicacao sobe normalmente e a extracao rest
  # falha com status FALHA, o que deixa o PDF salvo pronto para reprocessar.
  # -------------------------------------------------------------------------
  ia:
    tipo: ${PLATAFORMA_IA_TIPO:rest}
    url: ${IA_API_URL:https://api.openai.com/v1/chat/completions}
    modelo: ${IA_MODELO:gpt-4o-mini}
    chave: ${IA_API_KEY:}

logging:
  level:
    br.com.romenig.plataforma: INFO
