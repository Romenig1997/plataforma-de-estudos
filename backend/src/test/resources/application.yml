spring:
  application:
    name: plataforma-de-estudos

  # -------------------------------------------------------------------------
  # Banco em memoria para os testes.
  #
  # MODE=PostgreSQL faz o H2 aceitar o mesmo SQL do schema.sql usado no
  # Supabase. Assim os testes validam o DDL real, e nao um schema gerado
  # aparte. DB_CLOSE_DELAY=-1 mantem o banco vivo entre os testes.
  # -------------------------------------------------------------------------
  datasource:
    url: jdbc:h2:mem:plataforma;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  # Mesmas migrations da aplicacao (db/migration), sem duplicar DDL em dois
  # lugares. No H2 em memoria o schema nasce vazio, entao o Flyway executa a
  # V1 e a V2 do zero a cada boot; o Hibernate so valida contra o resultado.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

plataforma:
  # Sexta-feira, 16/10/2026: a "semana atual" dos testes comeca em 12/10/2026.
  relogio:
    fixo: 2026-10-16T12:00:00-03:00

  # -------------------------------------------------------------------------
  # Supabase Auth simulado nos TESTES.
  #
  # Nenhum teste fala com o Supabase. Os tokens sao emitidos pelos proprios
  # testes (TokensDeTeste), assinados com este segredo HS256 e com o emissor
  # {url}/auth/v1, exatamente como o Supabase faz com o segredo legado. O
  # segredo abaixo nao e uma credencial: so existe neste arquivo de teste.
  # -------------------------------------------------------------------------
  supabase:
    url: https://projeto-de-teste.supabase.co
    jwt-secret: segredo-de-teste-sem-valor-real-com-mais-de-32-bytes
    chave-publica: chave-publica-de-teste

  # Fotos de perfil em memoria, sem rede.
  armazenamento:
    tipo: memoria

  # Sem schema auth no H2: a remocao do login do Supabase fica em memoria.
  identidades:
    tipo: memoria

  # Feriados definidos pelos proprios testes; nenhum teste chama a BrasilAPI.
  feriados:
    tipo: memoria

  # -------------------------------------------------------------------------
  # Extracao de editais nos testes (HU07, incremento A): sempre a
  # implementacao fake, deterministico e sem rede. A IA real nunca e chamada
  # pela suite - em nenhum teste e em nenhum perfil.
  # -------------------------------------------------------------------------
  ia:
    tipo: fake

logging:
  level:
    br.com.romenig.plataforma: INFO
    org.hibernate.SQL: WARN
