spring:
  application:
    name: plataforma-de-estudos

  # -------------------------------------------------------------------------
  # Banco em memoria para os testes.
  #
  # MODE=PostgreSQL faz o H2 aceitar o mesmo SQL do schema.sql usado no
  # Supabase. Assim os testes validam o DDL real, e nao um schema gerado
  # aparte. DB_CLOSE_DELAY=-1 mantem o banco vivo entre os testes.
  # -------------------------------------------------------------------------
  datasource:
    url: jdbc:h2:mem:plataforma;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  # Mesmas migrations da aplicacao (db/migration), sem duplicar DDL em dois
  # lugares. No H2 em memoria o schema nasce vazio, entao o Flyway executa a
  # V1 e a V2 do zero a cada boot; o Hibernate so valida contra o resultado.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# ---------------------------------------------------------------------------
# Hash de senha com iteracoes baixas: em teste o custo do PBKDF2 se paga a
# cada cadastro e nao agrega nada. O formato do hash e identico ao de
# producao, so muda o numero de iteracoes.
# ---------------------------------------------------------------------------
plataforma:
  senha:
    iteracoes: 1000

  # -------------------------------------------------------------------------
  # Segredo de assinatura do JWT nos TESTES.
  #
  # Este valor nao e um segredo: ele so existe neste arquivo de teste, nunca
  # em producao, e existe para que os testes de aceite da HU02 possam emitir e
  # validar token sem depender do backend/.env. O backend/.env guarda o
  # segredo real e nao e versionado.
  # -------------------------------------------------------------------------
  jwt:
    chave: pMSris4ml9g2Oi7ZcwLKtrH6PNzV91z1nJCAJN3tGVN11p76WIOgpWuxdEiPqpT4
    emissor: plataforma-de-estudos
    expiracao-minutos: 60

  email:
    exigir-confirmacao: false

  limites:
    habilitado: false

  # -------------------------------------------------------------------------
  # Extracao de editais nos testes (HU07, incremento A): sempre a
  # implementacao fake, deterministico e sem rede. A IA real nunca e chamada
  # pela suite - em nenhum teste e em nenhum perfil.
  # -------------------------------------------------------------------------
  ia:
    tipo: fake

logging:
  level:
    br.com.romenig.plataforma: INFO
    org.hibernate.SQL: WARN
