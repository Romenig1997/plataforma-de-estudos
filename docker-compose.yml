# Orquestra APENAS o backend e o frontend.
# O banco de dados NAO esta aqui: e o PostgreSQL do Supabase (Cloud).
#
# As credenciais vem do arquivo .env NA RAIZ do projeto (mesmo diretorio
# deste compose). O Compose le esse arquivo automaticamente; exportalas no
# terminal tambem funciona e tem precedencia sobre ele.
#
# Sem DB_URL/DB_USERNAME/DB_PASSWORD o Compose aborta com mensagem explicita,
# em vez de subir um backend quebrado.

# Exemplo de uso:
#   docker compose up --build

# Uso opcional. O projeto tambem roda nativamente, sem Docker:
#   backend  -> cd backend && .\mvnw.cmd spring-boot:run
#   frontend -> cd frontend && npm install && npm run dev
#
services:
  backend:
    build:
      context: ./backend
    image: plataforma-backend
    container_name: plataforma-backend
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      # Required: o container recebe por environment, porque a imagem so
      # carrega o jar. A falha e explicita se algo faltar.
      DB_URL: ${DB_URL:?defina DB_URL no .env da raiz}
      DB_USERNAME: ${DB_USERNAME:?defina DB_USERNAME no .env da raiz}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env da raiz}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env da raiz}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      EMAIL_EXIGIR_CONFIRMACAO: ${EMAIL_EXIGIR_CONFIRMACAO:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_REMETENTE: ${SMTP_REMETENTE:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: plataforma-frontend
    container_name: plataforma-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
