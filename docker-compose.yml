# Orquestra APENAS o backend e o frontend.
# O banco de dados NAO esta aqui: e o PostgreSQL do Supabase (Cloud).
#
# As credenciais ficam em backend/.env, o mesmo arquivo usado ao executar o
# Spring Boot fora dos containers. Ele nunca deve ser enviado ao Git.

# Exemplo de uso:
#   Copy-Item backend/.env.example backend/.env
#   # preencher backend/.env
#   docker compose up --build

# Uso opcional. O projeto tambem roda nativamente, sem Docker:
#   backend  -> cd backend && .\mvnw.cmd spring-boot:run
#   frontend -> cd frontend && npm install && npm run dev
#
services:
  backend:
    build:
      context: ./backend
    image: plataforma-backend
    container_name: plataforma-backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: plataforma-frontend
    container_name: plataforma-frontend
    ports:
      - "5173:80"
    environment:
      # Mantem a mesma imagem compativel com o Railway e com o Compose local.
      PORT: 80
      API_UPSTREAM: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
