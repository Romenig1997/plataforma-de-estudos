# Configuracao do servidor web (SPA React)
server {
    listen ${PORT};
    server_name _;

    # O backend aceita PDFs de edital de até 30 MB. Sem este limite explícito,
    # o Nginx rejeita o multipart antes de encaminhá-lo para a API.
    client_max_body_size 32m;

    root /usr/share/nginx/html;
    index index.html;

    # build do Vite gera nomes com hash, entao o cache pode ser longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API permanece no mesmo dominio publico da SPA.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_request_buffering off;
        # O upstream pode ser o dominio publico da API no Railway. Encaminhar
        # o Host da interface faria o edge voltar para este proprio nginx.
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: rotas do cliente sao servidas pelo index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # frame-src blob: libera o leitor de PDF do curso, que mostra o arquivo baixado
    # da API como blob: no iframe. Um blob: so existe na propria pagina que o criou.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; base-uri 'self'; frame-src 'self' blob: https://*.supabase.co https://*.supabase.com; frame-ancestors 'none'; form-action 'self'" always;
}
