# Configuracao do servidor web (SPA React)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # build do Vite gera nomes com hash, entao o cache pode ser longo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: rotas do cliente sao servidas pelo index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}